name: One-time commit email cleanup

on:
  workflow_dispatch:
    inputs:
      expected_head:
        description: Exact main commit SHA reviewed before this one-time run
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: one-time-commit-email-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    permissions:
      contents: write
    if: github.repository == 'doosanofficial-ui/streamdeck-mobile-setup' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      EXPECTED_HEAD: ${{ inputs.expected_head }}
      NOREPLY_EMAIL: 242116938+doosanofficial-ui@users.noreply.github.com
    steps:
      - name: Check out main without saved credentials
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Verify the exact approved history
        shell: bash
        run: |
          set -euo pipefail
          [[ "$EXPECTED_HEAD" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git rev-parse HEAD^)" = 3defb906577ffe15432b66ee79330e144c85524f
          test "$(git diff-tree --no-commit-id --name-status -r HEAD)" = "$(printf 'A\t.github/workflows/privacy-cleanup.yml')"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$EXPECTED_HEAD"
          test "$(git ls-remote --heads --tags origin | wc -l | tr -d ' ')" = 1
          test "$(git rev-list --count HEAD)" = 10
          test "$(git rev-list --merges HEAD | wc -l | tr -d ' ')" = 0
          expected=$(printf '%s\n' 3aaeeebc368692bb0d425e470036331cf51a2979 ca147feb0f5fb497b9f9eb014e206770d588d477 d9e538fefac9bf7996be85195a08c73b444052ca)
          test "$(git rev-list --reverse HEAD | head -n 3)" = "$expected"
      - name: Rewrite only the three approved email identities
        shell: bash
        env:
          FILTER_BRANCH_SQUELCH_WARNING: '1'
        run: |
          set -euo pipefail
          git branch --no-track sanitized-history HEAD
          git filter-branch --env-filter '
            case "$GIT_COMMIT" in
              3aaeeebc368692bb0d425e470036331cf51a2979|ca147feb0f5fb497b9f9eb014e206770d588d477|d9e538fefac9bf7996be85195a08c73b444052ca)
                export GIT_AUTHOR_EMAIL="$NOREPLY_EMAIL"
                export GIT_COMMITTER_EMAIL="$NOREPLY_EMAIL"
                ;;
            esac
          ' -- sanitized-history
      - name: Verify every rewritten commit preserves its files and message
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import re
          import subprocess
          def git(*args):
              return subprocess.check_output(['git', *args])
          def records(header):
              result = []
              for line in header.split(b'\n'):
                  if line.startswith(b' '):
                      result[-1] += b'\n' + line
                  else:
                      result.append(line)
              return result
          old = git('rev-list', '--reverse', os.environ['EXPECTED_HEAD']).decode().splitlines()
          new = git('rev-list', '--reverse', 'sanitized-history').decode().splitlines()
          assert len(old) == len(new) == 10, 'Unexpected history length'
          mapping = {}
          noreply = os.environ['NOREPLY_EMAIL'].encode()
          for index, (before, after) in enumerate(zip(old, new)):
              old_header, separator, old_message = git('cat-file', 'commit', before).partition(b'\n\n')
              new_header, new_separator, new_message = git('cat-file', 'commit', after).partition(b'\n\n')
              assert separator and new_separator and old_message == new_message, 'Commit message bytes changed'
              expected = []
              for record in records(old_header):
                  key = record.split(b' ', 1)[0]
                  if key in (b'gpgsig', b'gpgsig-sha256'):
                      continue
                  if key == b'parent':
                      record = b'parent ' + mapping[record.split(b' ', 1)[1].decode()].encode()
                  if index < 3 and key in (b'author', b'committer'):
                      record, count = re.subn(rb' <[^>\n]*>(?= \d+ [+-]\d{4}$)', b' <' + noreply + b'>', record)
                      assert count == 1, 'Unexpected identity format'
                  expected.append(record)
              assert b'\n'.join(expected) == new_header, 'Unexpected commit header change'
              mapping[before] = after
          print('All 10 commits preserve exact file trees, messages, names and dates.')
          print('Only the first three email identities, parent hashes and invalidated signatures changed.')
          print('Verified clean head:', new[-1])
          PY
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Re-run all mock tests before publishing
        run: node --test
      - name: Publish only the verified main history with an exact lease
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          askpass="$RUNNER_TEMP/one-time-git-askpass.sh"
          trap 'rm -f "$askpass"' EXIT
          cat > "$askpass" <<'SH'
          #!/bin/sh
          case "$1" in
            *Username*) printf '%s\n' 'x-access-token' ;;
            *Password*) printf '%s\n' "$GITHUB_TOKEN" ;;
            *) exit 1 ;;
          esac
          SH
          chmod 700 "$askpass"
          GIT_ASKPASS="$askpass" GIT_TERMINAL_PROMPT=0 git push \
            --force-with-lease="refs/heads/main:$EXPECTED_HEAD" \
            https://github.com/doosanofficial-ui/streamdeck-mobile-setup.git \
            sanitized-history:refs/heads/main
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$(git rev-parse sanitized-history)"
          echo 'Verified rewritten main. Remove this maintenance workflow after the run.'
