name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Syntax, JSON, and mock tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Check JavaScript syntax
        run: |
          node --check demo/model.js
          node --check demo/app.js
          node --check demo/model.test.cjs
          node --check profiles/recipe.test.cjs
          node --check examples/vpn-plan-only/guard-contract.mjs
          node --check examples/vpn-plan-only/guard-contract.test.mjs
      - name: Parse both configuration examples
        run: |
          node -e 'const fs = require("node:fs"); for (const file of ["examples/buttons.example.json", "profiles/mobile-starter.example.json"]) { JSON.parse(fs.readFileSync(file, "utf8")); console.log("Valid JSON:", file); }'
      - name: Run all mock tests
        run: node --test
